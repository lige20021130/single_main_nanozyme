  - value: "other"
    aliases: []

probe_molecules:
  description: "Signal indicator molecules used in assays, NOT target analytes. These generate the measurable signal but are not the substance being detected."
  examples:
    - name: "crystal violet"
      aliases: ["CV+", "CV"]
    - name: "methylene blue"
      aliases: ["MB"]
    - name: "rhodamine B"
