    "o2-": "superoxide-dismutase-like"
  catalase-like:
    glucose: "glucose-oxidase-like"
    superoxide: "superoxide-dismutase-like"
  superoxide-dismutase-like:
    glucose: "glucose-oxidase-like"
    h2o2: "peroxidase-like"
  glutathione-peroxidase-like:
    glucose: "glucose-oxidase-like"
    superoxide: "superoxide-dismutase-like"
  oxidase-like:
    h2o2: "peroxidase-like"
  glucose-oxidase-like:
